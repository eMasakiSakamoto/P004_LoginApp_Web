<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #555;
        font-weight: 600;
        font-size: 14px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e1e1;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
      }
      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .message-error {
        background: #ffe0e0;
        color: #d32f2f;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
      }
      .message-success {
        background: #e0f5e0;
        color: #2e7d32;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
      }
      .message-info {
        background: #e0e8f5;
        color: #1565c0;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
      }
      .register-link {
        text-align: center;
        margin-top: 20px;
      }
      .register-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
      }
      .register-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>🔐 ログイン</h1>

      <!-- エラーメッセージ -->
      <div th:if="${errorMessage}" class="message-error">
        <span th:text="${errorMessage}"></span>
      </div>

      <!-- ログアウトメッセージ -->
      <div th:if="${logoutMessage}" class="message-info">
        <span th:text="${logoutMessage}"></span>
      </div>

      <!-- 登録成功メッセージ -->
      <div th:if="${successMessage}" class="message-success">
        <span th:text="${successMessage}"></span>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="ユーザー名を入力"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
            required
          />
        </div>

        <button type="submit" class="btn">ログイン</button>
      </form>

      <div class="register-link">
        <p>
          アカウントをお持ちでない方は
          <a th:href="@{/register}">新規登録</a>
        </p>
      </div>
    </div>
  </body>
</html>
